body{margin:0;width:1600px;height:900px;overflow:hidden;background:#f4f1ea;font-family:'Noto Sans KR',sans-serif;color:#141a2a;position:relative}
.terr{position:absolute;inset:0;background-image:radial-gradient(circle at 12% 20%,#e26d5a 0 9px,transparent 10px),radial-gradient(circle at 78% 30%,#2b4c7e 0 14px,transparent 15px),radial-gradient(circle at 55% 82%,#f2b134 0 11px,transparent 12px),radial-gradient(circle at 28% 70%,#4a8f6b 0 8px,transparent 9px),radial-gradient(circle at 90% 78%,#e26d5a 0 12px,transparent 13px),radial-gradient(circle at 40% 15%,#2b4c7e 0 7px,transparent 8px),radial-gradient(circle at 65% 55%,#4a8f6b 0 10px,transparent 11px);opacity:.25}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(20,26,42,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(20,26,42,.06) 1px,transparent 1px);background-size:80px 80px}
h1{position:absolute;left:100px;top:200px;margin:0;font-size:92px;line-height:1.05;font-weight:900;letter-spacing:-.03em}
h1 span{color:#2b4c7e}
p{position:absolute;left:104px;top:500px;font-size:24px;color:#4b5563;margin:0;font-family:'Space Grotesk'}
.shelf{position:absolute;right:120px;top:140px;width:520px;height:600px;perspective:1200px}
.row{position:absolute;left:0;right:0;height:170px;transform:rotateY(-22deg) rotateX(6deg);transform-style:preserve-3d;border-bottom:14px solid #d9d2c3;box-shadow:0 20px 30px -10px rgba(0,0,0,.2)}
.row i{position:absolute;bottom:0;display:block;border-radius:2px 6px 6px 2px;box-shadow:-6px 0 12px rgba(0,0,0,.15)}
.stamp{position:absolute;left:104px;top:600px;width:150px;height:150px;border:5px double #b8323b;border-radius:50%;color:#b8323b;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;transform:rotate(-12deg);opacity:.85;text-align:center;line-height:1.2}
.v{position:absolute;right:60px;top:40px;font-family:'Space Grotesk';letter-spacing:.3em;color:#6b7280}
.chip{position:absolute;left:300px;top:640px;display:flex;gap:12px}.chip span{background:#141a2a;color:#fff;padding:10px 18px;border-radius:8px;font-size:15px}
</style></head><body>
