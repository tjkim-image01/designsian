<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=Cormorant+Garamond:ital,wght@1,600&display=swap');
body{margin:0;width:1600px;height:900px;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#3a1810 0%,#160a0c 55%,#07050a 100%);font-family:'Noto Serif KR',serif;color:#f6e7c8;position:relative}
.lantern{position:absolute;border-radius:40% 40% 45% 45%/30% 30% 60% 60%;box-shadow:0 0 60px 20px rgba(255,150,60,.35),inset 0 -30px 40px rgba(120,30,0,.5);background:radial-gradient(circle at 50% 30%,#ffd28a,#ff8c3a 60%,#b8401a);opacity:.95}
.lantern:after{content:"";position:absolute;left:50%;bottom:-40px;width:3px;height:40px;background:#e5b060;transform:translateX(-50%)}
.hz{position:absolute;bottom:0;left:0;right:0;height:180px;background:linear-gradient(to top,rgba(255,120,40,.25),transparent)}
h1{position:absolute;left:100px;top:200px;margin:0;font-size:96px;line-height:1.05;font-weight:900;text-shadow:0 8px 40px rgba(0,0,0,.6)}
h1 em{font-family:'Cormorant Garamond',serif;color:#ffb35c;font-weight:600}
p{position:absolute;left:104px;top:590px;font-size:26px;letter-spacing:.05em;color:#e9c99a;margin:0}
.tag{position:absolute;left:104px;top:660px;display:flex;gap:14px}.tag span{border:1px solid rgba(255,190,100,.5);padding:8px 18px;border-radius:999px;font-size:16px;color:#ffd7a3}
.book{position:absolute;width:120px;height:170px;border-radius:4px 10px 10px 4px;box-shadow:-8px 10px 30px rgba(0,0,0,.6);transform:rotate(-8deg)}
.grain{position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='.06'/></svg>")}
.v{position:absolute;right:60px;top:40px;font-size:18px;letter-spacing:.3em;color:#c99a63}
</style></head><body>
<div class="hz"></div>
<div class="lantern" style="left:1050px;top:120px;width:140px;height:190px"></div>
<div class="lantern" style="left:1280px;top:260px;width:200px;height:260px"></div>
<div class="lantern" style="left:900px;top:380px;width:110px;height:150px;opacity:.8"></div>
<div class="lantern" style="left:1180px;top:560px;width:150px;height:200px"></div>
<div class="lantern" style="left:1420px;top:40px;width:90px;height:120px;opacity:.7"></div>
<div class="lantern" style="left:760px;top:80px;width:80px;height:110px;opacity:.6"></div>
<div class="book" style="left:1000px;top:640px;background:linear-gradient(135deg,#7a2c1f,#c86a3c)"></div>
<div class="book" style="left:1110px;top:700px;background:linear-gradient(135deg,#243a5a,#5a86b8);transform:rotate(6deg)"></div>
<div class="book" style="left:1380px;top:640px;background:linear-gradient(135deg,#3c5a2a,#8fb46a);transform:rotate(-3deg)"></div>
<div class="v">WEB v7 · MOOD</div>
<h1>등불 아래<br>세계의 <em>이야기</em>가<br>모입니다</h1>
<p>Lantern Night Library — 다문화 도서관 납품 플랫폼</p>
<div class="tag"><span>Three.js 3D 등불</span><span>등불 전시관</span><span>따뜻한 야경</span><span>사서 견적함</span></div>
<div class="grain"></div>
</body></html>
