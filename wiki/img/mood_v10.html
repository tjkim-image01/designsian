<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&family=Fredoka:wght@600;700&display=swap');
body{margin:0;width:1600px;height:900px;overflow:hidden;background:linear-gradient(180deg,#bfe9ff 0%,#eaf7ff 60%,#fff3d6 100%);font-family:'Noto Sans+KR','Noto Sans KR',sans-serif;color:#2b2d5c;position:relative}
.cloud{position:absolute;background:#fff;border-radius:999px;box-shadow:0 20px 30px rgba(80,120,160,.15)}
.b{position:absolute;bottom:120px;border-radius:14px 14px 4px 4px;box-shadow:0 30px 40px -10px rgba(40,60,120,.35)}
.b:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(255,255,255,.35) 18px 26px),repeating-linear-gradient(0deg,transparent 0 22px,rgba(255,255,255,.35) 22px 30px);border-radius:inherit}
.ground{position:absolute;left:0;right:0;bottom:0;height:120px;background:#8ed19a;border-top:10px solid #6fbf7d}
h1{position:absolute;left:90px;top:170px;margin:0;font-size:92px;line-height:1.05;font-weight:900;letter-spacing:-.02em;text-shadow:4px 4px 0 #fff}
h1 span{color:#ff7a59}
p{position:absolute;left:94px;top:470px;font-size:24px;margin:0;color:#4a4e8a;font-family:'Fredoka'}
.chip{position:absolute;left:94px;top:540px;display:flex;gap:12px}.chip span{background:#fff;color:#2b2d5c;padding:10px 18px;border-radius:999px;font-size:15px;font-weight:700;box-shadow:0 6px 0 #d6e6f5}
.v{position:absolute;right:60px;top:40px;font-family:'Fredoka';letter-spacing:.3em;color:#6a7aa0}
.conf{position:absolute;width:14px;height:22px;border-radius:3px}
</style></head><body>

<div class="cloud" style="left:700px;top:120px;width:180px;height:70px;opacity:.8"></div>
<div class="ground"></div>
<div class="b" style="left:860px;width:120px;height:330px;background:#ff7a59"></div>
<div class="b" style="left:1000px;width:160px;height:470px;background:#3d7bff"></div>
<div class="b" style="left:1180px;width:110px;height:260px;background:#ffc843"></div>
<div class="b" style="left:1310px;width:140px;height:400px;background:#7bd389"></div>
<div class="b" style="left:1470px;width:100px;height:300px;background:#b784ff"></div>
<div class="b" style="left:760px;width:80px;height:200px;background:#ff9ec6"></div>
<div class="conf" style="left:900px;top:200px;background:#ffc843;transform:rotate(30deg)"></div>
<div class="conf" style="left:1250px;top:150px;background:#ff7a59;transform:rotate(-20deg)"></div>

<div class="v">WEB v10 · MOOD</div>

</body></html>
